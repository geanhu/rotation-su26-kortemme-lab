hydra:
  run:
    dir: hydra_outputs
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - ckpt_name_or_path=soluble_caliby
    - sampling_cfg_overrides.num_seqs_per_pdb=24
    - sampling_cfg_overrides.batch_size=1
    - seed=0
    - max_num_conformers=10
    - ++sampling_cfg_overrides.omit_aas=["C", "H"]
    - ++sampling_cfg_overrides.potts_sampling_cfg.potts_temperature=0.01
    - input_cfg.conformer_dir=/wynton/home/rotation/geanhu/multi-state/data/string-sampling/ensembles
    - out_dir=/wynton/home/rotation/geanhu/multi-state/data/caliby-output/5KPE-5KPH/temp10-2
  job:
    name: seq_des_ensemble
    chdir: null
    override_dirname: ++sampling_cfg_overrides.omit_aas=["C", "H"],++sampling_cfg_overrides.potts_sampling_cfg.potts_temperature=0.01,ckpt_name_or_path=soluble_caliby,input_cfg.conformer_dir=/wynton/home/rotation/geanhu/multi-state/data/string-sampling/ensembles,max_num_conformers=10,out_dir=/wynton/home/rotation/geanhu/multi-state/data/caliby-output/5KPE-5KPH/temp10-2,sampling_cfg_overrides.batch_size=1,sampling_cfg_overrides.num_seqs_per_pdb=24,seed=0
    id: ???
    num: ???
    config_name: seq_des_ensemble
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /wynton/home/rotation/geanhu/multi-state/scripts
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /wynton/home/rotation/geanhu/software/caliby/caliby/configs/eval/sampling
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /wynton/home/rotation/geanhu/multi-state/scripts/hydra_outputs
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
